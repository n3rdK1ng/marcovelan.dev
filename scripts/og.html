<!doctype html>
<!--
	Source for the social preview cards (public/og.png, public/og-cs.png) and
	the home-screen icon (public/apple-touch-icon.png). Open it from the repo
	root over file://, then screenshot the element:
	  #card at 1200×630 → og.png  (og.html#cs → og-cs.png)
	  #icon at 180×180  → apple-touch-icon.png
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Geist';
				src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Geist';
				src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-ext-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
				unicode-range: U+0100-024F;
			}
			@font-face {
				font-family: 'Geist Mono';
				src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Geist Mono';
				src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-ext-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
				unicode-range: U+0100-024F;
			}

			:root {
				--paper: #0a0a0a;
				--ink: #ededed;
				--muted: #a1a1a1;
				--line: #262626;
			}

			* {
				margin: 0;
				box-sizing: border-box;
			}

			body {
				background: var(--paper);
				-webkit-font-smoothing: antialiased;
			}

			#card {
				display: flex;
				flex-direction: column;
				width: 1200px;
				height: 630px;
				padding: 72px 80px 64px;
				background: var(--paper);
				color: var(--ink);
				font-family: 'Geist', sans-serif;
			}

			.mono {
				font-family: 'Geist Mono', monospace;
				font-size: 24px;
				color: var(--muted);
			}

			h1 {
				margin-top: auto;
				font-size: 128px;
				font-weight: 500;
				line-height: 1;
				letter-spacing: -0.05em;
			}

			.role {
				margin-top: 20px;
				font-size: 44px;
				letter-spacing: -0.02em;
				color: var(--muted);
			}

			.foot {
				display: flex;
				justify-content: space-between;
				margin-top: 64px;
				padding-top: 28px;
				border-top: 1px solid var(--line);
			}

			#icon {
				display: grid;
				place-items: center;
				width: 180px;
				height: 180px;
				margin-top: 40px;
				background: #171717;
				color: #fff;
				font-family: 'Geist Mono', monospace;
				font-size: 72px;
				font-weight: 600;
				letter-spacing: -0.04em;
			}
		</style>
	</head>
	<body>
		<div id="card">
			<p class="mono">marcovelan.dev</p>
			<h1>Marco Velan</h1>
			<p
				class="role"
				data-en="Fullstack engineer &amp; tech lead"
				data-cs="Fullstack vývojář &amp; tech lead"
			></p>
			<div class="foot">
				<p
					class="mono"
					data-en="TypeScript · Web &amp; mobile"
					data-cs="TypeScript · Web &amp; mobil"
				></p>
				<p class="mono" data-en="Czech Republic" data-cs="Česká republika"></p>
			</div>
		</div>
		<div id="icon">MV</div>
		<script>
			const lang = location.hash === '#cs' ? 'cs' : 'en'
			document.documentElement.lang = lang
			for (const el of document.querySelectorAll('[data-en]')) {
				el.textContent = el.dataset[lang]
			}
		</script>
	</body>
</html>
